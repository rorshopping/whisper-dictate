name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CPU torch is the default PyPI wheel on Windows - the bundled build
      # runs everywhere and falls back from GPU to CPU at runtime.
      - name: Install dependencies
        run: pip install faster-whisper sounddevice numpy pystray pynput pyperclip Pillow torch transformers librosa rapidfuzz pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean WhisperDictate.spec

      - name: Zip
        run: Compress-Archive -Path dist/WhisperDictate/* -DestinationPath WhisperDictate-${{ github.ref_name }}-windows-x64.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: WhisperDictate-${{ github.ref_name }}-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install faster-whisper sounddevice numpy pystray pynput pyperclip Pillow torch transformers librosa rapidfuzz pyinstaller

      # On macOS the spec's BUNDLE emits dist/WhisperDictate.app; ship the
      # stapled-or-unsigned bundle as a zip.
      - name: Build
        run: pyinstaller --noconfirm --clean WhisperDictate.spec

      - name: Zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent WhisperDictate.app "../WhisperDictate-${{ github.ref_name }}-macos-arm64.zip"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: WhisperDictate-${{ github.ref_name }}-macos-arm64.zip
